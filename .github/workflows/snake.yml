name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Astrak00
          outputs: |
            dist/github-snake.svg?palette=github-light&color_dots=#dfe6f2,#9db5ff,#6b8dff,#2140c8,#0f1a2e
            dist/github-snake-dark.svg?palette=github-dark&color_dots=#152447,#2f4a8f,#5570d6,#8ba5ff,#e9edf5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

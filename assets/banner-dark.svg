    <!-- orbits: the "astro" in Astrak -->
    <g transform="translate(985 150)">
      <circle r="118" fill="none" stroke="#2f3d5c" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle r="78" fill="none" stroke="#2f3d5c" stroke-width="1.5"/>
      <circle r="40" fill="none" stroke="#2f3d5c" stroke-width="1.5" stroke-dasharray="12 6"/>
      <circle r="9" fill="#8ba5ff"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>

      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#152447"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
    <style>
      .name { font: 800 92px/1 Archivo, "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: #e9edf5; }
      .line { font: 500 22px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #9aa6bc; }
      .caret { animation: blink 1.1s steps(1) infinite; fill: #8ba5ff; }
      @keyframes blink { 50% { opacity: 0; } }
      .type { animation: type 4.5s steps(46) 0.6s both; }
      @keyframes type { from { width: 0; } to { width: 612px; } }
      @media (prefers-reduced-motion: reduce) { .type { animation: none; width: 612px; } .caret { animation: none; } }
    </style>
  </defs>


    <!-- orbits: the "astro" in Astrak -->
    <g transform="translate(985 150)">
      <circle r="118" fill="none" stroke="#c3cbd8" stroke-width="1.5" stroke-dasharray="3 7"/>
      <circle r="78" fill="none" stroke="#c3cbd8" stroke-width="1.5"/>
      <circle r="40" fill="none" stroke="#c3cbd8" stroke-width="1.5" stroke-dasharray="12 6"/>
      <circle r="9" fill="#2140c8"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle cx="118" cy="0" r="6" fill="#0f1a2e"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="140" to="-220" dur="11s" repeatCount="indefinite"/>

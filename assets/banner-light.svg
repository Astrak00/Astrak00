    <text class="name" x="64" y="146">Eduardo Alarcón</text>

    <!-- typed line with a clipped, expanding window -->
    <svg x="64" y="186" width="760" height="40" overflow="hidden">
      <g>
        <clipPath id="typewin"><rect class="type" x="0" y="0" height="40"/></clipPath>
        <text class="line" x="0" y="27" clip-path="url(#typewin)">$ building tools for students, one at a time</text>

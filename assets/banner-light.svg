      <stop offset="0" stop-color="#eef1f5"/>
      <stop offset="1" stop-color="#dfe6f2"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
    <style>
      .name { font: 800 92px/1 Archivo, "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: #0f1a2e; }
      .line { font: 500 22px/1 "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; fill: #5b6577; }
      .caret { animation: blink 1.1s steps(1) infinite; fill: #2140c8; }
      @keyframes blink { 50% { opacity: 0; } }
      .type { animation: type 4.5s steps(46) 0.6s both; }
      @keyframes type { from { width: 0; } to { width: 612px; } }
      @media (prefers-reduced-motion: reduce) { .type { animation: none; width: 612px; } .caret { animation: none; } }
    </style>
  </defs>

